services:
  smart-fridge:
    # Pull from Docker Hub: mvsr313/smart-refrigerator:latest
    # To build locally instead, comment out 'image' and uncomment 'build'
    image: mvsr313/smart-refrigerator:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: smart-refrigerator
    ports:
      - "5000:5000"
    environment:
      - DB_BACKEND=sqlite
      - SECRET_KEY=${SECRET_KEY:-smart-fridge-super-secret-key-2024}
      - SQLITE_DB_PATH=/app/data/smart_fridge.db
      # Optionally switch to supabase:
      # - DB_BACKEND=supabase
      # - SUPABASE_URL=https://your-project.supabase.co
      # - SUPABASE_KEY=your-supabase-key
    volumes:
      # Persist the SQLite database outside the container
      - fridge_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  fridge_data:
    driver: local
